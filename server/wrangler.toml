name = "time-sync"
main = "worker.ts"
compatibility_date = "2024-11-01"

# Without this binding, the worker falls back to an in-memory store — fine
# for `wrangler dev`, lost on every restart.
[[d1_databases]]
binding = "DB"
database_name = "time-sync"
database_id = "d50ca725-7e1c-4eb2-9b3b-1dfc2a1b64c5"
