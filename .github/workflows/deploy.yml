name: Deploy to GitHub Pages

# Pushes to either branch redeploy both. `main` lands at /time/ and acts as
# the stable fallback; `sync-protocol` lands at /time/sync/ for testing the
# end-to-end encrypted sync flow.
on:
  push:
    branches: [main, sync-protocol]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: sync-protocol
          path: sync
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Build main (root)
        working-directory: main
        run: |
          npm ci
          npm run build

      - name: Build sync-protocol (/sync subpath)
        working-directory: sync
        env:
          VITE_BASE: /time/sync/
        run: |
          npm ci
          npm run build

      - name: Combine into one Pages artifact
        run: |
          mkdir -p main/dist/sync
          cp -r sync/dist/. main/dist/sync/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
